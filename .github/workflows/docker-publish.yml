name: Docker Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish (e.g. v2.4.5-rc1)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: liquidsoap-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/onairhq/liquidsoap

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Read version from Git tag
        id: version
        shell: bash
        env:
          GIT_REF: ${{ inputs.tag || github.ref_name }}
        run: |
          TAG="${GIT_REF#refs/tags/}"

          if ! [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-rc[0-9]+)?$ ]]; then
            echo "Invalid release tag: $TAG"
            echo "Expected format: vX.Y.Z or vX.Y.Z-rcN"
            exit 1
          fi

          VERSION="${BASH_REMATCH[1]}"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "liquidsoap_version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            LIQUIDSOAP_VERSION=${{ steps.version.outputs.liquidsoap_version }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/onairhq/liquidsoap
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
